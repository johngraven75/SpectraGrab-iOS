name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Restore
        run: dotnet restore SpectraGrab.iOS.csproj

      - name: Build Release simulator target
        run: dotnet build SpectraGrab.iOS.csproj -f net8.0-ios -c Release --no-restore -p:RuntimeIdentifier=iossimulator-x64

      - name: Upload iOS validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpectraGrab-iOS-${{ github.sha }}
          path: bin/Release/net8.0-ios/iossimulator-x64/**
          if-no-files-found: error

      - name: Signing readiness
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          if [[ -n "$APPLE_CERTIFICATE_P12" && -n "$APPLE_PROVISIONING_PROFILE" && -n "$APP_STORE_CONNECT_API_KEY" ]]; then
            echo "Apple signing/publishing secrets are configured."
          else
            echo "Unsigned CI validation is green-capable; signed IPA/TestFlight publication remains blocked until Apple credentials are configured."
          fi


      - name: Package unsigned iOS simulator build
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent bin/Release/net8.0-ios/iossimulator-x64 artifacts/SpectraGrab-iOS-Simulator.zip
          test -s artifacts/SpectraGrab-iOS-Simulator.zip

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ios-build-${{ github.run_number }}"
          gh release create "$tag" artifacts/SpectraGrab-iOS-Simulator.zip --target "${{ github.sha }}" --title "SpectraGrab iOS Build ${{ github.run_number }}" --notes "Automated unsigned iOS simulator release with one-link AI download planning, direct/HLS transfer, adult metadata verification, provider posters, and NFO sidecars. Signed IPA/TestFlight publication requires Apple credentials."


      - name: Report build failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "⚠️ SpectraGrab iOS build failed — run ${{ github.run_number }}" --body "Current-commit iOS build or publication failed. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} Commit: ${{ github.sha }}" --label automated
