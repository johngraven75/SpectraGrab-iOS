name: Total Automation Baseline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: git diff --check
      - shell: bash
        run: |
          if git grep -n -E '^(<<<<<<< |>>>>>>> )' -- .; then exit 1; fi
      - shell: bash
        run: |
          echo '### iOS automation baseline' >> "$GITHUB_STEP_SUMMARY"
          test -f REPO_RULES.md
          test -f docs/CROSS_PLATFORM_SYNC.md
          test -f SpectraGrab.iOS.csproj
          echo '- Rules: installed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Cross-platform parity contract: installed' >> "$GITHUB_STEP_SUMMARY"
          echo '- iOS MAUI project: detected' >> "$GITHUB_STEP_SUMMARY"
      - shell: bash
        run: test -z "$(git status --porcelain)"